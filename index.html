<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaborExpress Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-900/90 h-16 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center font-bold">
        <i data-lucide="utensils" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base text-white">SaborExpress</h1>
        <p class="text-[11px] text-emerald-400 font-semibold">&bull; Aberto Agora &bull; 30-45 min</p>
      </div>
    </div>
    <button onclick="alert('Sacola: ' + bag.length + ' itens adicionados!')" class="px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold flex items-center gap-2">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i>
      <span>Sacola (<span id="bagCount">0</span>)</span>
    </button>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="menuGrid"></div>
  </main>

  <script>
    let bag = [];
    const dishes = [
      { id: 1, name: 'Burger Artesanal Trufado', desc: 'Hambúrguer 180g, queijo cheddar inglês e maionese trufada.', price: 42.00, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80' },
      { id: 2, name: 'Pizza Napolitana Margherita', desc: 'Molho pelado italiano, mozzarella di bufala e manjericão fresco.', price: 58.00, img: 'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=400&q=80' },
      { id: 3, name: 'Poke Salmão Premium', desc: 'Salmão fresco em cubos, manga, edamame e gergelim tostado.', price: 49.90, img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80' },
      { id: 4, name: 'Sobremesa Brownie com Sorvete', desc: 'Brownie belga quentinho com sorvete de baunilha e calda de caramelo.', price: 26.00, img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400&q=80' },
    ];

    function renderMenu() {
      document.getElementById('menuGrid').innerHTML = dishes.map(d => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex gap-4 items-center">
          <img src="${d.img}" class="w-20 h-20 rounded-xl object-cover shrink-0">
          <div class="flex-1 min-w-0 space-y-1">
            <h3 class="font-bold text-xs text-white">${d.name}</h3>
            <p class="text-[11px] text-slate-400 line-clamp-2">${d.desc}</p>
            <div class="flex items-center justify-between pt-1">
              <span class="font-bold text-amber-400 font-mono text-xs">R$ ${d.price.toFixed(2)}</span>
              <button onclick="addToBag(${d.id})" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-semibold">Pedir</button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function addToBag(id) {
      const item = dishes.find(d => d.id === id);
      bag.push(item);
      document.getElementById('bagCount').innerText = bag.length;
      alert(item.name + ' adicionado à sacola!');
    }

    renderMenu();
  </script>
</body>
</html>
